<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" fill="none" role="img" aria-label="Centralisation des finances sur Spend.Up">
  <defs>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5D87FF"/>
      <stop offset="100%" stop-color="#1E4078"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFF"/>
      <stop offset="100%" stop-color="#E8F0FF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5D87FF" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background blobs -->
  <ellipse cx="120" cy="520" rx="180" ry="90" fill="#E8F0FF" opacity="0.9"/>
  <ellipse cx="780" cy="120" rx="160" ry="100" fill="#D6E4FF" opacity="0.85"/>
  <ellipse cx="450" cy="580" rx="220" ry="55" fill="#F2F6FF" opacity="0.95"/>

  <!-- Decorative leaves -->
  <g fill="#B8D4F0" opacity="0.7">
    <path d="M48 180c18-8 28 6 22 20-8 18-28 10-22-20z"/>
    <path d="M62 168c10 14 0 26-14 18 10-6 10-14 14-18z"/>
    <path d="M830 500c20-10 32 8 24 24-10 22-34 12-24-24z"/>
    <path d="M848 488c12 16 2 30-16 22 12-8 12-16 16-22z"/>
  </g>

  <!-- Connector lines (dashed, inward flow) -->
  <g stroke="#5D87FF" stroke-width="2" stroke-dasharray="7 6" opacity="0.55">
    <path d="M450 310 L450 148"/>
    <path d="M450 310 L658 210"/>
    <path d="M450 310 L720 390"/>
    <path d="M450 310 L658 510"/>
    <path d="M450 310 L242 510"/>
    <path d="M450 310 L180 390"/>
    <path d="M450 310 L242 210"/>
  </g>

  <!-- Arrowheads toward center -->
  <g fill="#5D87FF" opacity="0.65">
    <polygon points="450,318 444,330 456,330"/>
    <polygon points="520,268 508,262 514,276"/>
    <polygon points="590,318 578,322 586,334"/>
    <polygon points="590,402 578,398 586,386"/>
    <polygon points="520,452 508,458 514,444"/>
    <polygon points="380,452 392,458 386,444"/>
    <polygon points="310,402 322,398 314,386"/>
    <polygon points="310,318 322,322 314,334"/>
  </g>

  <!-- Orbit ring -->
  <circle cx="450" cy="320" r="198" stroke="#5D87FF" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.2" fill="none"/>

  <!-- Central hub: Spend.Up platform -->
  <g filter="url(#softShadow)">
    <rect x="330" y="250" width="240" height="170" rx="22" fill="url(#hubGrad)"/>
    <rect x="348" y="268" width="204" height="128" rx="14" fill="url(#screenGrad)"/>
    <!-- Dashboard mini UI -->
    <rect x="364" y="284" width="72" height="10" rx="5" fill="#5D87FF" opacity="0.25"/>
    <rect x="364" y="302" width="48" height="8" rx="4" fill="#5D87FF" opacity="0.15"/>
    <rect x="364" y="322" width="88" height="56" rx="10" fill="#fff" stroke="#C5D9FF" stroke-width="1.5"/>
    <path d="M372 362 L388 342 L400 352 L416 328 L440 362Z" fill="#5D87FF" opacity="0.35"/>
    <rect x="464" y="322" width="72" height="26" rx="8" fill="#fff" stroke="#C5D9FF" stroke-width="1.5"/>
    <rect x="472" y="330" width="36" height="6" rx="3" fill="#5D87FF" opacity="0.3"/>
    <rect x="464" y="356" width="72" height="22" rx="8" fill="#fff" stroke="#C5D9FF" stroke-width="1.5"/>
    <circle cx="478" cy="367" r="5" fill="#49BEFF"/>
    <rect x="490" y="364" width="34" height="6" rx="3" fill="#5D87FF" opacity="0.2"/>
    <!-- Brand mark -->
    <circle cx="450" cy="228" r="28" fill="#fff"/>
    <path d="M438 228c0-8 6-14 12-14s12 6 12 14-6 14-12 14" fill="none" stroke="#5D87FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M450 218v16M444 228h12" stroke="#5D87FF" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="450" y="448" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E4078">Spend.Up</text>
  <text x="450" y="468" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5D87FF" opacity="0.8">Plateforme centrale</text>

  <!-- Satellite: Transactions (top) -->
  <g transform="translate(408, 88)">
    <circle cx="42" cy="42" r="42" fill="#fff" stroke="#C5D9FF" stroke-width="2"/>
    <rect x="24" y="28" width="36" height="28" rx="6" fill="#E8F0FF"/>
    <path d="M30 36h24M30 44h18M30 52h22" stroke="#5D87FF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="42" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#1E4078">Transactions</text>
  </g>

  <!-- Satellite: Comptes (top-right) -->
  <g transform="translate(616, 148)">
    <circle cx="42" cy="42" r="42" fill="#fff" stroke="#C5D9FF" stroke-width="2"/>
    <rect x="22" y="30" width="40" height="30" rx="4" fill="#5D87FF" opacity="0.15"/>
    <path d="M28 30h28v6H28z" fill="#5D87FF" opacity="0.4"/>
    <rect x="30" y="40" width="8" height="14" rx="1" fill="#5D87FF"/>
    <rect x="42" y="40" width="8" height="14" rx="1" fill="#5D87FF" opacity="0.6"/>
    <rect x="54" y="40" width="8" height="14" rx="1" fill="#5D87FF" opacity="0.35"/>
    <text x="42" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#1E4078">Comptes</text>
  </g>

  <!-- Satellite: Patrimoine (right) -->
  <g transform="translate(678, 348)">
    <circle cx="42" cy="42" r="42" fill="#fff" stroke="#C5D9FF" stroke-width="2"/>
    <path d="M24 50h36l-6-14h-24l-6 14z" fill="#5D87FF" opacity="0.25"/>
    <rect x="30" y="50" width="24" height="16" rx="2" fill="#5D87FF" opacity="0.45"/>
    <rect x="38" y="42" width="8" height="8" fill="#5D87FF"/>
    <text x="42" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#1E4078">Patrimoine</text>
  </g>

  <!-- Satellite: Collaboration (bottom-right) -->
  <g transform="translate(616, 468)">
    <circle cx="42" cy="42" r="42" fill="#fff" stroke="#C5D9FF" stroke-width="2"/>
    <circle cx="32" cy="40" r="9" fill="#5D87FF" opacity="0.35"/>
    <circle cx="52" cy="40" r="9" fill="#5D87FF" opacity="0.55"/>
    <circle cx="42" cy="54" r="9" fill="#5D87FF" opacity="0.45"/>
    <text x="42" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#1E4078">Collaboration</text>
  </g>

  <!-- Satellite: Budgets (bottom-left) -->
  <g transform="translate(200, 468)">
    <circle cx="42" cy="42" r="42" fill="#fff" stroke="#C5D9FF" stroke-width="2"/>
    <circle cx="42" cy="42" r="18" fill="none" stroke="#5D87FF" stroke-width="6" stroke-dasharray="28 56" transform="rotate(-90 42 42)"/>
    <circle cx="42" cy="42" r="10" fill="#5D87FF" opacity="0.2"/>
    <text x="42" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#1E4078">Budgets</text>
  </g>

  <!-- Satellite: Fichiers (left) -->
  <g transform="translate(138, 348)">
    <circle cx="42" cy="42" r="42" fill="#fff" stroke="#C5D9FF" stroke-width="2"/>
    <path d="M22 38h14l4 6h22v22H22z" fill="#FF6B6B" opacity="0.85"/>
    <path d="M36 38v6h18" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="42" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#1E4078">Fichiers</text>
  </g>

  <!-- Satellite: Prévisions (top-left) -->
  <g transform="translate(200, 148)">
    <circle cx="42" cy="42" r="42" fill="#fff" stroke="#C5D9FF" stroke-width="2"/>
    <path d="M22 54 L32 44 L42 50 L52 34 L62 54Z" fill="none" stroke="#5D87FF" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="22" y1="54" x2="62" y2="54" stroke="#C5D9FF" stroke-width="2"/>
    <text x="42" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#1E4078">Prévisions</text>
  </g>

  <!-- Dot pattern accents -->
  <g fill="#5D87FF" opacity="0.12">
    <circle cx="760" cy="280" r="3"/><circle cx="776" cy="296" r="3"/><circle cx="792" cy="280" r="3"/>
    <circle cx="108" cy="240" r="3"/><circle cx="124" cy="256" r="3"/><circle cx="92" cy="256" r="3"/>
  </g>
</svg>

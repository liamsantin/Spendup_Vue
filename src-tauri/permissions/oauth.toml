[[permission]]
identifier = "allow-oauth-loopback-wait"
description = "Allow listening for Google OAuth loopback redirects on 127.0.0.1"
commands.allow = ["oauth_loopback_wait"]

[[permission]]
identifier = "allow-google-exchange-code"
description = "Allow exchanging a Google OAuth authorization code for an id_token"
commands.allow = ["google_exchange_code"]
